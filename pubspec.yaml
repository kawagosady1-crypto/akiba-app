name: akiba
description: Akiba - savings tracker with goals, withdrawals, challenges and reports.
publish_to: 'none'
version: 4.0.0+4

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  shared_preferences: ^2.3.2
  flutter_local_notifications: '>=17.2.0 <18.0.0'
  timezone: '>=0.9.4 <0.10.0'
  local_auth: '>=2.3.0 <3.0.0'
  image_picker: ^1.1.2
  path_provider: ^2.1.4
  pdf: ^3.11.0
  printing: ^5.13.0
  home_widget: '>=0.7.0 <1.0.0'
  share_plus: '>=10.0.0 <11.0.0'
  file_picker: '>=10.0.0 <11.0.0'

dev_dependencies:
  flutter_launcher_icons: ^0.14.1

flutter:
  uses-material-design: true

flutter_launcher_icons:
  android: true
  ios: false
  image_path: "assets/icon/icon.png"
  adaptive_icon_background: "#0F7B5F"
  adaptive_icon_foreground: "assets/icon/icon_fg.png"
  min_sdk_android: 21
