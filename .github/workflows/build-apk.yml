name: Build Android APK
on:
  push:
    branches: [main, master]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Generate Android project files
        run: |
          flutter create --org com.akiba --project-name akiba --platforms android .
          rm -rf test
      - name: Set up the signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ] && [ -n "$KEYSTORE_PASSWORD" ]; then
            echo "$KEYSTORE_BASE64" | tr -d ' \n\r' | base64 -d > android/app/upload-keystore.jks
            printf 'storePassword=%s\nkeyPassword=%s\nkeyAlias=akiba\nstoreFile=upload-keystore.jks\n' "$KEYSTORE_PASSWORD" "$KEYSTORE_PASSWORD" > android/key.properties
            echo "Signing key found"
          else
            echo "No signing secrets: building with a temporary key"
          fi
      - name: Add Akiba's Android settings
        run: python3 tool/patch_android.py
      - run: flutter pub get
      - name: Make the app icon
        run: dart run flutter_launcher_icons
      - name: Build APK
        run: |
          set -o pipefail
          flutter build apk --release 2>&1 | tee build.log
      - name: Show the error
        if: failure()
        run: |
          {
            echo '### Build error'
            echo '```'
            grep -E "Error:|error:|What went wrong|e: |FAILURE" -A 6 build.log | head -n 60 || true
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
      - run: cp build/app/outputs/flutter-apk/app-release.apk Akiba.apk
      - uses: actions/upload-artifact@v4
        with:
          name: Akiba-apk
          path: Akiba.apk
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: Akiba build ${{ github.run_number }}
          files: Akiba.apk
